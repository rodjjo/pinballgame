<svg xmlns="http://www.w3.org/2000/svg" width="72" height="16" viewBox="0 0 72 16">
  <!-- Polished steel wall rail: rounded ends, bright top sheen, dark belly,
       faint end shading. Origin used at the left endpoint, scaled to each
       wall's length. -->
  <!-- body -->
  <rect x="1" y="1" width="70" height="14" rx="7" ry="7"
        fill="#5f6d85" stroke="#39435a" stroke-width="1"/>
  <!-- top highlight -->
  <rect x="9" y="3" width="54" height="3.6" rx="1.8" ry="1.8"
        fill="#b6c2de" opacity="0.9"/>
  <!-- lower shadow band -->
  <rect x="7" y="11" width="58" height="2.4" rx="1.2" ry="1.2"
        fill="#333c4e" opacity="0.8"/>
  <!-- faint end caps so the rail reads as a single polished piece -->
  <ellipse cx="8" cy="8" rx="3" ry="5.5" fill="#75839e" opacity="0.5"/>
  <ellipse cx="64" cy="8" rx="3" ry="5.5" fill="#75839e" opacity="0.5"/>
</svg>
