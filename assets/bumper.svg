<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Classic ring bumper: dark metal ring around a hot glowing core.
       Origin at centre (50,50); the outer glow band has r 36 texels, which the
       game scales so its edge lands on each bumper's physics radius. -->
  <!-- dark ring base -->
  <circle cx="50" cy="50" r="45" fill="#0e2f38"/>
  <!-- bright rim line + inner ring bevel -->
  <circle cx="50" cy="50" r="43.5" fill="none" stroke="#67e3ee" stroke-width="2.2" opacity="0.95"/>
  <circle cx="50" cy="50" r="38.5" fill="none" stroke="#12444f" stroke-width="1.6" opacity="0.9"/>
  <!-- glow core: concentric hot bands (centre = hottest), outer band r = 36 -->
  <circle cx="50" cy="50" r="36" fill="#1793ab"/>
  <circle cx="50" cy="50" r="28" fill="#2ebcc9"/>
  <circle cx="50" cy="50" r="21" fill="#6fdcea"/>
  <circle cx="50" cy="50" r="14" fill="#b7f2f6"/>
  <circle cx="50" cy="50" r="8"  fill="#e9fdff"/>
  <circle cx="50" cy="50" r="3.5" fill="#ffffff"/>
  <!-- eight small studs set into the ring between the rim and the core -->
  <g fill="#8feef2" opacity="0.85">
    <circle cx="91" cy="50" r="2.4"/>
    <circle cx="79.2" cy="79.2" r="2.4"/>
    <circle cx="50" cy="91" r="2.4"/>
    <circle cx="20.8" cy="79.2" r="2.4"/>
    <circle cx="9" cy="50" r="2.4"/>
    <circle cx="20.8" cy="20.8" r="2.4"/>
    <circle cx="50" cy="9" r="2.4"/>
    <circle cx="79.2" cy="20.8" r="2.4"/>
  </g>
  <!-- sheen over the upper-left of the core -->
  <ellipse cx="40" cy="40" rx="10" ry="6.5" fill="#ffffff" opacity="0.5"
           transform="rotate(-30 40 40)"/>
</svg>
