<svg xmlns="http://www.w3.org/2000/svg" width="600" height="680" viewBox="0 0 600 680">
  <!-- Jolly Roger skull watermark for the playfield background. The art is
       centred on the canvas so the sprite origin at (300,340) lands at the same
       game-space point as before. Everything is drawn in a faint bone palette so
       it reads as a low-key watermark behind the action. -->

  <!-- crossbones behind the head; the head is drawn in front -->
  <g stroke="#8b8263" stroke-width="3" fill="#c2b79a">
    <line x1="150" y1="150" x2="450" y2="580" stroke-width="26" fill="none"/>
    <line x1="450" y1="150" x2="150" y2="580" stroke-width="26" fill="none"/>
    <!-- knobby bone ends (two lobes per tip) -->
    <circle cx="138.6" cy="158" r="17"/>
    <circle cx="161.4" cy="142" r="17"/>
    <circle cx="438.6" cy="142" r="17"/>
    <circle cx="461.4" cy="158" r="17"/>
    <circle cx="138.6" cy="588" r="17"/>
    <circle cx="161.4" cy="572" r="17"/>
    <circle cx="438.6" cy="572" r="17"/>
    <circle cx="461.4" cy="588" r="17"/>
  </g>

  <!-- cranium -->
  <g stroke="#8b8263" stroke-width="3" fill="#d8ceb2">
    <ellipse cx="300" cy="305" rx="132" ry="135"/>
    <!-- temporal hollows (subtle side shading) -->
    <ellipse cx="214" cy="296" rx="22" ry="30" fill="#b9ad8c" opacity="0.5"/>
    <ellipse cx="386" cy="296" rx="22" ry="30" fill="#b9ad8c" opacity="0.5"/>
  </g>
  <!-- faint crack down the front of the cranium -->
  <path d="M300 176 L287 224 L297 262 L289 292" fill="none" stroke="#8b8263"
        stroke-width="2.5" opacity="0.8"/>

  <!-- jaw / cheek -->
  <g stroke="#8b8263" stroke-width="3" fill="#d8ceb2">
    <ellipse cx="300" cy="440" rx="104" ry="92"/>
  </g>
  <ellipse cx="300" cy="468" rx="44" ry="20" fill="#b3a784" opacity="0.5"/>

  <!-- eye sockets -->
  <ellipse cx="246" cy="322" rx="30" ry="36" fill="#14161e"
           transform="rotate(-8 246 322)"/>
  <ellipse cx="246" cy="322" rx="30" ry="36" fill="none" stroke="#8b8263"
           stroke-width="2.5" transform="rotate(-8 246 322)"/>
  <ellipse cx="354" cy="322" rx="30" ry="36" fill="#14161e"
           transform="rotate(8 354 322)"/>
  <ellipse cx="354" cy="322" rx="30" ry="36" fill="none" stroke="#8b8263"
           stroke-width="2.5" transform="rotate(8 354 322)"/>

  <!-- nose cavity -->
  <path d="M283 352 L317 352 L300 392 Z" fill="#14161e"
        stroke="#8b8263" stroke-width="2.5"/>

  <!-- teeth: dark mouth gap with bone septa -->
  <rect x="234" y="404" width="132" height="36" rx="10" fill="#14161e"/>
  <g stroke="#8b8263" stroke-width="2.5">
    <line x1="252" y1="406" x2="252" y2="438"/>
    <line x1="270" y1="406" x2="270" y2="438"/>
    <line x1="288" y1="406" x2="288" y2="438"/>
    <line x1="306" y1="406" x2="306" y2="438"/>
    <line x1="324" y1="406" x2="324" y2="438"/>
    <line x1="342" y1="406" x2="342" y2="438"/>
  </g>
</svg>
