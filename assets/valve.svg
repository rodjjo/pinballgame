<svg xmlns="http://www.w3.org/2000/svg" width="80" height="16" viewBox="0 0 80 16">
  <!-- One-way flap-valve plate for the launch channel mouth. Drawn with its
       pivot end at the left (hinge corner at x=2, y=16) and the plate extending
       along +x, so the game pins it at the wall-top pivot and scales its length
       to the physics plate. The engine draws the hinge pin over that corner. -->
  <!-- Steel plate body, slightly tapered toward the free end. -->
  <path d="M 4 2.2
           L 74 3.6
           Q 78 4.4 78 8
           Q 78 11.6 74 12.4
           L 4 13.8
           Q 2.5 8 4 2.2 Z"
        fill="#5d6a84" stroke="#39445a" stroke-width="1"/>
  <!-- top highlight / bottom shadow make the thickness and tilt readable -->
  <rect x="10" y="3.2" width="62" height="2.4" rx="1.2" ry="1.2"
        fill="#cdd7ea" opacity="0.9"/>
  <rect x="10" y="11" width="62" height="2" rx="1" ry="1"
        fill="#272f3f" opacity="0.85"/>
  <!-- rivets along the plate spine -->
  <g>
    <circle cx="26" cy="8.2" r="1.5" fill="#333b4c"/>
    <circle cx="25.6" cy="7.7" r="0.6" fill="#9aa6c0" opacity="0.8"/>
    <circle cx="42" cy="8.2" r="1.5" fill="#333b4c"/>
    <circle cx="41.6" cy="7.7" r="0.6" fill="#9aa6c0" opacity="0.8"/>
    <circle cx="58" cy="8.2" r="1.5" fill="#333b4c"/>
    <circle cx="57.6" cy="7.7" r="0.6" fill="#9aa6c0" opacity="0.8"/>
    <circle cx="70" cy="8.2" r="1.3" fill="#333b4c"/>
  </g>
  <!-- hinge boss at the pivot end (under the engine-drawn pin) -->
  <circle cx="6" cy="8" r="3.2" fill="#46526c"/>
  <circle cx="6" cy="8" r="1.3" fill="#2a3142"/>
</svg>
