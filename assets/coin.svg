<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <!-- Gold pickup coin: origin at centre (30,30); the outer rim has r 27 texels,
       which the game scales so its edge lands on the physics radius. -->
  <!-- dark rim, then the brass face -->
  <circle cx="30" cy="30" r="27" fill="#8a5a06"/>
  <circle cx="30" cy="30" r="25.5" fill="#d9a41d"/>
  <circle cx="30" cy="30" r="21" fill="#ffd44a"/>
  <circle cx="30" cy="30" r="21" fill="none" stroke="#caa11c" stroke-width="1.6" opacity="0.9"/>
  <!-- embossed five-point star: dark under, bright over (two-layer relief) -->
  <polygon points="30,19 27.3,33.7 19.5,33.4 25.6,28.6 23.5,21.1 30,25.4 36.5,21.1 34.4,28.6 40.5,33.4 32.7,33.7"
           fill="#a87c0e"/>
  <polygon points="30,22.3 28.1,32.6 22.5,32.4 26.9,29 25.4,23.7 30,26.8 34.6,23.7 33.1,29 37.5,32.4 31.9,32.6"
           fill="#ffe88c"/>
  <!-- sheen, upper-left -->
  <ellipse cx="20.5" cy="20.5" rx="8.5" ry="5.2" fill="#ffffff" opacity="0.4"
           transform="rotate(-30 20.5 20.5)"/>
  <!-- lower rim light -->
  <path d="M 13 41 A 25.5 25.5 0 0 0 47 41" fill="none" stroke="#f0c95f"
        stroke-width="1.6" opacity="0.7"/>
</svg>
