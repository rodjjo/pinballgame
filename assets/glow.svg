  <circle cx="32" cy="32" r="20" fill="#ffffff" opacity="0.28"/>
  <circle cx="32" cy="32" r="16.5" fill="#ffffff" opacity="0.42"/>
  <circle cx="32" cy="32" r="13" fill="#ffffff" opacity="0.58"/>
  <circle cx="32" cy="32" r="9.5" fill="#ffffff" opacity="0.76"/>
  <circle cx="32" cy="32" r="6" fill="#ffffff" opacity="0.9"/>
  <circle cx="32" cy="32" r="3" fill="#ffffff" opacity="0.98"/>
  <circle cx="32" cy="32" r="1.2" fill="#ffffff"/>
</svg>
