<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Polished steel pinball: soft-lit sphere, origin at centre (24,24), r 22.
       Light from the upper-left; layered translucent bands fake the gradient. -->
  <!-- base sphere -->
  <circle cx="24" cy="24" r="22" fill="#c9d2e2"/>
  <!-- lower-right core shadow (two layers for a smooth falloff) -->
  <ellipse cx="31.5" cy="32.5" rx="15" ry="12.5" fill="#59637d" opacity="0.55"/>
  <ellipse cx="34" cy="35" rx="10.5" ry="8" fill="#3a4358" opacity="0.6"/>
  <!-- broad upper-left sheen -->
  <ellipse cx="15.5" cy="15.5" rx="13" ry="9" fill="#eef3fc" opacity="0.7"
           transform="rotate(-35 15.5 15.5)"/>
  <!-- hot specular sparkle -->
  <ellipse cx="13.5" cy="13.5" rx="5.5" ry="3.6" fill="#ffffff" opacity="0.95"
           transform="rotate(-35 13.5 13.5)"/>
  <!-- faint rim light along the bottom edge -->
  <path d="M 9.5 33 A 21 21 0 0 0 38.5 33" fill="none" stroke="#aeb9d2"
        stroke-width="1.4" opacity="0.6"/>
  <!-- crisp outer edge -->
  <circle cx="24" cy="24" r="22" fill="none" stroke="#5d6880" stroke-width="1.6"/>
</svg>
